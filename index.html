<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB SOLUTIONS INDIA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="icon">
            <h2 class="logo">Website</h2>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">ABOUT US</a></li>
                <li><a href="#">SERVICES</a></li>
                <li><a href="#">PORTFOLIO</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>
        </nav>
        <div class="search">
            <input class="srch" type="text" placeholder="Search...">
            <button class="btn">Search</button>
        </div>
    </header>
    <main class="content">
        <h1>Web Design & <br><span>Development</span> <br>Solutions</h1>
        <p class="par">“To be the most creative organization in the world”<br>
           "To empower every person and every organization on the planet to achieve more"</p>
        <button class="cn"><a href="#">JOIN US</a></button>
    </main>
    
    <!-- Chatbot -->
    <div class="chatbot">
        <button class="chatbot-toggle">💬</button>
        <div class="chatbox">
            <div class="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Ask me anything...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
